[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srd-rules-engine"
dynamic = ["version"]
description = "An SRD 5.2 rules engine that holds outcome authority, so an LLM dungeon master can interpret fiction but cannot invent results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "eddiefiggie" }]
keywords = ["srd", "dnd", "5e", "rules-engine", "tabletop", "llm", "agent", "dungeon-master"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Typing :: Typed",
]

# R33 is enforced here, not by convention: the core takes no LLM dependency and no
# network dependency. `dependencies` staying empty is the machine-readable form of
# that promise. Adapters (MCP, HTTP, CLI) declare their own needs as extras below.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# The MCP adapter's transport. An extra, never a dependency: R33 keeps
# `[project].dependencies` empty, and installing the library must not install a
# network stack.
mcp = ["mcp>=2"]

[project.urls]
Homepage = "https://github.com/eddiefiggie/srd-rules-engine"
Issues = "https://github.com/eddiefiggie/srd-rules-engine/issues"

[tool.hatch.version]
path = "src/srd_rules_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/srd_rules_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -W error::pytest.PytestCollectionWarning"
# Every test here is a module-level function. Emptying `python_classes` stops pytest's
# `Test*` heuristic from trying to collect domain types — the SRD calls the primitive a
# "D20 Test", so `D20Test` and `TestKind` are the right names for the domain and only
# look like test classes to a collector. Renaming them to appease the heuristic would put
# the tail in charge of the vocabulary.
python_classes = []

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# The MCP SDK is an optional extra, so a checkout without it must still type-check. The
# import is inside a function and guarded, and the adapter is typed against `Any` at that
# boundary — so this silences a missing module, not a missing type.
[[tool.mypy.overrides]]
module = ["mcp.*", "mcp"]
ignore_missing_imports = true
