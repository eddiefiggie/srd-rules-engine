name: CI

# The full gate on every pull request. `main` is protected and this is its required
# check, so a red suite surfaces before the merge rather than after it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  record-index:
    name: The README lists every record
    # Hermetic, unlike the status-rows job beside it: this reads the tree only. It is a job
    # rather than only a pytest test so a records-only change that forgot to regenerate is
    # named by CI as its own failure rather than buried in a suite run (#282).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the generated record index
        run: python scripts/render_record_index.py --check

  status-rows:
    name: Status rows cite open issues
    # Every push, not only a pull request: a row goes stale when a build MERGES and its record
    # is not revisited, so `main` is exactly where the drift lands. The first run of this
    # check found twelve such rows, all created the same day (#291).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Status tables against live issue state
        # `gh` is preinstalled on the runner and GITHUB_TOKEN is enough to read issue state.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_status_rows.py

  build-stamp:
    name: Build stamp advanced
    # Only on a pull request: on `main` there is nothing to advance past, and the question
    # this asks — is this stamp free — has no meaning outside a proposed merge (#147).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the base branch
        # `actions/checkout` is depth 1 by default, so the base tip is not in the clone and
        # `git show origin/<base>:...` would fail on the revision rather than on the stamp.
        run: |
          git fetch --depth=1 origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the stamp advanced past the base branch tip
        # The TIP, not the merge base: two branches from one commit can each advance past
        # their shared base and still land on the same stamp.
        run: |
          python scripts/check_build_stamp_advanced.py \
            "origin/${{ github.base_ref }}"

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
